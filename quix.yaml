# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: OPCServer
    application: OPCServer
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: opcserver
    network:
      serviceName: intopcserver
      ports:
        - port: 4840
          targetPort: 4840
    variables: []
  - name: OPCClient
    application: OPCClient
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: ''
        required: false
        value: opc_data
  - name: Downsampling
    application: Downsampling
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        required: false
        value: opc_data
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        required: false
        value: transform
  - name: Websocket Destination
    application: Websocket Destination
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 200
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: websocket
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        required: true
        value: downsampled
      - name: USERNAME
        inputType: Secret
        description: Websocket username
        required: true
        secretKey: websocket_uername
      - name: PASSWORD
        inputType: Secret
        description: Websocket password
        required: true
        secretKey: websocket_password

# This section describes the Topics of the data pipeline
topics:
  - name: opc_data
    configuration:
      replicationFactor: 2
      retentionInMinutes: 1440
      retentionInBytes: 52428800
  - name: downsampled
    configuration:
      replicationFactor: 2
      retentionInMinutes: 1440
      retentionInBytes: 52428800
  - name: transform
